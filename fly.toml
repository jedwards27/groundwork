# Groundwork on Fly.io, for the hosted demo: one machine serves the web app and its API (under /api)
# from one origin. scripts/deploy-fly.sh deploys it (docs/HOSTING.md, ADR 0007, ADR 0009).
#
# Secrets (database URLs, signing secret, admin token, optional Anthropic key) come from .env.hosted
# through `fly secrets import`; nothing secret is in this file.
app = "groundwork-demo"
primary_region = "iad"  # Ashburn, next to Neon's aws-us-east-1

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  # Once per deploy, in a temporary machine with the app's secrets: migrate, then reload the Lake
  # Mariner fixture. A deploy therefore also resets the demo.
  release_command = "groundwork release"

[env]
  GROUNDWORK_HOSTED = "true"            # dry run forced, 1-hour tokens, tamper refused, preflight enforced
  EXECUTORS_DRY_RUN = "true"
  GROUNDWORK_DEMO_LOGIN = "true"        # fictional personas over synthetic data only
  GROUNDWORK_DB_NULLPOOL = "true"       # let Neon's free compute scale to zero between visits
  GROUNDWORK_DAILY_RUN_CAP = "300"      # every run, per day
  GROUNDWORK_DAILY_LIVE_RUN_CAP = "30"  # runs that call Claude, per day; then the simulated planner
  GROUNDWORK_NIGHTLY_RESET_UTC_HOUR = "8"  # 3 or 4 a.m. Eastern
  GROUNDWORK_SANDBOXES = "true"         # every visitor gets a private copy of the demo
  GROUNDWORK_SANDBOX_TTL_HOURS = "12"   # then it is deleted, ledger and all
  GROUNDWORK_SANDBOX_DAILY_CAP = "200"  # new sandboxes per day, across all visitors

[processes]
  # 0.0.0.0, not "::": Python opens an IPv6 socket as IPv6-only, and Fly's proxy connects over IPv4.
  app = "groundwork serve --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"  # one small machine, always warm for a live demo
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
