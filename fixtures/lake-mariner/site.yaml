# Lake Mariner, CB-5, seen from the end user's seat.
#
# Posture: the agent works for Anthropic, the END USER. TeraWulf (Lake Mariner Data LLC) is the
# landlord, developer and interconnection customer. Fluidstack is the lessee. Anthropic is not a
# party to the lease (Measured AI). So Anthropic's only direct counterparty on the base building is
# Fluidstack; TeraWulf is reached through Fluidstack, and NYSEG/NYISO/the town through TeraWulf.
# That routing is the `reached_via` column below, and the gateway derives every action's path from it.
#
# Provenance on every row: public (with a URL) | synthetic (written for the demo) |
# assumption_to_verify (our best understanding; check with a practitioner).

org:
  name: Groundwork demo org (end-user posture)
  timezone: America/New_York

site:
  key: lake-mariner
  name: Lake Mariner
  location: Barker (Town of Somerset), Niagara County, NY
  profile: datacenter
  as_of: 2026-11-02
  principal: anthropic
  attrs:
    iso_region: NYISO
    transmission_owner: NYSEG
    voltage_class: 345kV
    county: Niagara
  calendar:
    holidays: [2026-11-26, 2026-11-27, 2026-12-24, 2026-12-25, 2027-01-01]
    provenance: assumption_to_verify
    note: >-
      Working calendar shared by the EPC and NYSEG for business-day lags. Thanksgiving and the day
      after, Christmas Eve and Day, New Year's Day. Martin Luther King Day is treated as a workday.

asset:
  key: cb-5
  name: CB-5
  capacity_mw: 168
  milestones:
    - kind: delivery
      label: CB-5 lease delivery (commissioning Level 4)
      item: l4
      target_date: 2027-02-22
      binding_agreement: Fluidstack lease with TeraWulf; L4 is the contractual delivery milestone
      provenance: assumption_to_verify
      source: https://www.sec.gov/Archives/edgar/data/0001083301/000108330126000162/a_wulfearningsreleaseq22026.htm
      note: >-
        Public: CB-5 is "targeted to begin phased delivery in early 2027" (TeraWulf's Q2 2026 release,
        Aug 5, 2026), and L4 is the contractual delivery milestone (Q2 2026 call, said of CB-4). Feb 22
        is our inference, not a company date: energization in very early January, then CB-4's pace of
        about six weeks from L3 start-up to L4.
    - kind: energization
      label: CB-5 first data hall energizes (after NYSEG's witness test)
      item: witness
      target_date: 2027-01-06
      provenance: assumption_to_verify
      source: https://finance.yahoo.com/markets/stocks/articles/terawulf-inc-wulf-q2-2026-190057902.html
      note: >-
        Public: CB-5's first data hall "is expected to begin energizing in very early January" (TeraWulf's
        CTO on the Q2 2026 call, as summarized by GuruFocus; secondary). Jan 6, and modelling energization
        as the end of the witness test, are our assumptions.
    - kind: final_acceptance
      label: CB-5 final acceptance (after L5 integrated systems test)
      item: final_acceptance
      target_date: 2027-03-18
      provenance: synthetic

parties:
  - key: anthropic
    name: Anthropic
    roles: [end_user]
    provenance: public
    source: https://measuredai.substack.com/p/anthropic-data-centers
  - key: fluidstack
    name: Fluidstack
    roles: [lessee]
    provenance: public
    source: https://measuredai.substack.com/p/anthropic-data-centers
  - key: terawulf
    name: TeraWulf (Lake Mariner Data LLC)
    roles: [landlord, developer]
    reached_via: fluidstack
    provenance: public
    source: https://www.interconnection.fyi/project/nyiso-1670
    note: Interconnection customer of record is Lake Mariner Data LLC. Whether the end user may write to TeraWulf directly is practitioner question 17; default is through Fluidstack.
  - key: nyseg
    name: NYSEG
    roles: [to]
    level: state
    reached_via: terawulf
    provenance: public
    source: https://www.sec.gov/Archives/edgar/data/1083301/000110465922041168/wulf-20211231x10k.htm
    note: Point of interconnection at NYSEG's Kintigh 345 kV substation.
  - key: nyiso
    name: NYISO
    roles: [iso]
    level: state
    reached_via: terawulf
    provenance: public
    source: https://www.interconnection.fyi/project/nyiso-1670
  - key: nypa
    name: New York Power Authority (NYPA)
    roles: [agency]
    level: state
    reached_via: terawulf
    provenance: public
    source: https://hntrbrk.com/investigations/terawulf
    note: 90 MW HLF allocation is market power delivered through the utility, not grid capacity; it gates nothing on CB-5's chain.
  - key: somerset
    name: Town of Somerset (building department)
    roles: [ahj]
    level: local
    reached_via: terawulf
    provenance: public
    source: https://www.govtech.com/analytics/upstate-new-york-community-approves-ai-data-center-plan
  - key: inspection-agency
    name: Electrical inspection agency (third party)
    roles: [agency]
    level: local
    reached_via: terawulf
    provenance: assumption_to_verify
    source: https://tocny.org/wp-content/uploads/2026/04/BPD_26-4-30_Approved-Electrical-InspAgn.pdf
    note: Which approved agency Somerset uses is practitioner question 8.
  - key: nysdec
    name: NYS Department of Environmental Conservation (DEC)
    roles: [regulator]
    level: state
    reached_via: terawulf
    provenance: public
    source: https://www.dlapiper.com/en/insights/publications/2026/07/executive-order-pauses-dec-permits-for-data-centers-in-new-york
  - key: swgr-vendor
    name: Switchgear vendor (34.5 kV lineup)
    roles: [vendor]
    reached_via: terawulf
    provenance: synthetic
  - key: xfmr-vendor
    name: Transformer vendor (345/34.5 kV)
    roles: [vendor]
    reached_via: terawulf
    provenance: synthetic
  - key: gen-vendor
    name: Generator vendor
    roles: [vendor]
    reached_via: terawulf
    provenance: synthetic
  - key: ups-vendor
    name: UPS and battery vendor
    roles: [vendor]
    reached_via: terawulf
    provenance: synthetic
  - key: cooling-vendor
    name: Cooling equipment vendor
    roles: [vendor]
    reached_via: terawulf
    provenance: synthetic
  - key: epc
    name: EPC and commissioning agent
    roles: [epc]
    reached_via: terawulf
    provenance: synthetic
  - key: lender
    name: Landlord's construction lender
    roles: [lender]
    reached_via: terawulf
    provenance: assumption_to_verify
  - key: ie
    name: End user's independent engineer
    roles: [ie]
    provenance: synthetic
    note: Engaged by the end user directly. Whether the IE works on a call-off master agreement is an assumption to verify.
  - key: state-esd
    name: State economic-development contact (Empire State Development)
    roles: [agency]
    level: state
    provenance: assumption_to_verify
    note: Assumes the end user has a direct relationship with the state economic-development agency. Any message is record-bearing.

# The grant of authority. `preset` picks a template from the policy package (supervised | standard |
# autonomous); approvers are person keys below; owner_goals are what the blind planner arm sees
# instead of the mandate. Legal and notice kinds route to `legal_approvers`. The demo has one person
# who signs in (the visitor, as Dana), so Dana approves those too; a real project would name counsel.
mandate:
  preset: standard
  approvers: [dana]
  legal_approvers: [dana]
  sla_hours: 24
  owner_goals:
    - Protect the CB-5 delivery date (L4) and the dates downstream of it (fit-out, compute delivery).
    - Keep the end user's rights under the colocation agreement intact; never waive them by accident.
    - Work through the lessee; the end user has no direct contract with the landlord or the utility.
    - Prefer actions that recover days without new commitments; spend only against a written quote.

# Fictional people; addresses use the reserved .example domain. A visitor to the demo is Dana, the
# end user's project lead and its only approver. Everyone else is someone Dana works with.
