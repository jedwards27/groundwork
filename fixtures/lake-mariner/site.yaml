    value: 378 MW for Fluidstack (42 + 168 + 168)
    provenance: public
    source: https://measuredai.substack.com/p/anthropic-data-centers
  - label: Roles
    value: TeraWulf owns and develops; Fluidstack leases; Anthropic is the end user and not a party to the lease
    provenance: public
    source: https://measuredai.substack.com/p/anthropic-data-centers
  - label: CB-5 energization
    value: 168 MW; first data hall expected to begin energizing "very early January" 2027, moved from Q4 2026
    provenance: public
    source: https://finance.yahoo.com/markets/stocks/articles/terawulf-inc-wulf-q2-2026-190057902.html
  - label: CB-5 delivery
    value: Targeted to begin phased delivery in early 2027 (no date given)
    provenance: public
    source: https://www.sec.gov/Archives/edgar/data/0001083301/000108330126000162/a_wulfearningsreleaseq22026.htm
  - label: Point of interconnection
    value: NYSEG Kintigh 345 kV substation; dual 345 kV feeds
    provenance: public
    source: https://www.sec.gov/Archives/edgar/data/1083301/000110465922041168/wulf-20211231x10k.htm
  - label: Site history
    value: Former Kintigh coal plant, 650 to 675 MW
    provenance: public
    source: https://en.wikipedia.org/wiki/Kintigh_Generating_Station
  - label: NYPA allocation
    value: 90 MW HLF, market power delivered via the utility, not grid capacity
    provenance: public
    source: https://hntrbrk.com/investigations/terawulf
  - label: Contracted revenue
    value: $6.7B is TeraWulf's company-wide contracted revenue (Aug 2025), not this lease alone
