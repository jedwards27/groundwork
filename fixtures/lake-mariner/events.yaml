# Events the demo can play. Each is a message the end user would actually receive.
# Structured `impacts` are what extraction would produce (slice 4); for now they are written by hand
# and every duration is an assumption to verify.
#
# kind: schedule_change (moves dates) | evidence (adds facts, moves nothing) |
#       acknowledgment (an automated or third-party "approved" that must change nothing) |
#       injection (instructions aimed at an AI; used by the evals)

events:
  - key: demo-monday
    kind: schedule_change
    scripted: true
    title: "Demo: NYSEG re-review, and a switchgear change order with an instruction inside it"
    from: fluidstack
    forwarded_from: terawulf
    received_at: 2026-11-02T08:30:00-05:00
    message: inbox/demo-monday.eml
    links: [to_accept, coord_study, swgr]
    impacts:
      - item: to_accept
        low: 21
        high: 35
        calendar: calendar
        leg: "Landlord's engineer of record re-runs the coordination and arc-flash studies and resubmits (3 to 5 weeks, per TeraWulf's site PM)"
        owner: terawulf
      - item: to_accept
        low: 24
        high: 40
        calendar: calendar
        leg: "NYSEG re-review after resubmittal (quoted 4 to 6 weeks, net of review already done)"
        owner: nyseg
    provenance: synthetic
    note: >-
      The scripted two-minute demo. It always plays the hand-written plan: a status request the mandate
      lets the agent send alone, a request to the landlord that must route through the lessee and a named
      approver, and a refusal of an instruction planted in a vendor document. Same delay as event A.

