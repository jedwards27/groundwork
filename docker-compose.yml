# Two ways to use this file:
#   docker compose up -d db                  Postgres only, for `make dev` without a local Postgres
#   sh scripts/new-env.sh && docker compose --profile full up --build
#                                            Postgres, API and Mission Control: Docker is the only
#                                            prerequisite. Open http://localhost:3000
# Every port binds to 127.0.0.1, so nothing is reachable from the network.
x-secrets: &secrets
  GROUNDWORK_ADMIN_TOKEN: ${GROUNDWORK_ADMIN_TOKEN:?no .env with secrets; run sh scripts/new-env.sh first}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${GROUNDWORK_DB_PORT:-5432}:5432"
    volumes:
      - ./scripts/db-setup.sql:/docker-entrypoint-initdb.d/01-groundwork.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundwork"]
      interval: 2s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *secrets
      GROUNDWORK_DEV_HMAC_SECRET: ${GROUNDWORK_DEV_HMAC_SECRET:?no .env with secrets; run sh scripts/new-env.sh first}
      DATABASE_URL: postgresql+psycopg://groundwork_app:groundwork_app_dev@db:5432/groundwork
      DATABASE_OWNER_URL: postgresql+psycopg://groundwork_owner:groundwork_owner_dev@db:5432/groundwork
      EXECUTORS_DRY_RUN: "true"
      GROUNDWORK_DEMO_LOGIN: "true"
    command: >-
      sh -c "groundwork release && groundwork serve --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      start_period: 30s
      retries: 30
    ports:
      - "127.0.0.1:8000:8000"

  web:
    profiles: ["full"]
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *secrets
      GROUNDWORK_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
