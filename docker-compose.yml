# `docker compose up -d db`            Postgres only (for `make dev` without a local Postgres)
# `docker compose --profile full up`   Postgres + API (+ web from slice 3): Docker is the only prerequisite
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${GROUNDWORK_DB_PORT:-5432}:5432"
    volumes:
      - ./scripts/db-setup.sql:/docker-entrypoint-initdb.d/01-groundwork.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundwork"]
      interval: 2s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://groundwork_app:groundwork_app_dev@db:5432/groundwork
      DATABASE_OWNER_URL: postgresql+psycopg://groundwork_owner:groundwork_owner_dev@db:5432/groundwork
      EXECUTORS_DRY_RUN: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    command: >-
      sh -c "alembic upgrade head && groundwork seed && groundwork serve --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
