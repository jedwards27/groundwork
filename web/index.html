<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Projects that wait on outside organizations: what each one waits on, the forecast, and what Groundwork may do about it under your mandate." />
    <title>Groundwork</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* The tutorial points at one thing at a time. */
      /* The tour's highlight sits inside the element, so a scrolling or clipped container never cuts it
         and it never covers the text around it. */
      [data-tour="on"] { outline: 2px solid #276ef1; outline-offset: -2px; animation: gw-tour 1.6s ease-in-out infinite; }
      @keyframes gw-tour { 0%, 100% { outline-color: rgba(39, 110, 241, 1); } 50% { outline-color: rgba(39, 110, 241, 0.45); } }
      @media (prefers-reduced-motion: reduce) { [data-tour="on"] { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
