[project]
name = "groundwork"
version = "0.1.0"
description = "Coordination agent for paperwork-constrained builds: paper critical path, slip forecasts, bounded action under an explicit mandate, append-only ledger."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "networkx>=3.3",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "rfc8785>=0.1.4",
  "anthropic>=0.40",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "sse-starlette>=2.1",
  "mcp>=2.3",
]

[project.scripts]
groundwork = "groundwork.cli:app"

[project.optional-dependencies]
local = [
    "pgserver>=0.1.4 ; python_full_version < '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundwork"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
  "pyright>=1.1.370",
  "import-linter>=2.0",
  "pydantic-evals>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: needs the local Postgres configured by `make db-setup`",
  "live: calls the Claude API (skipped without ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends/Query and Typer Option defaults are idiomatic

[tool.pyright]
include = ["groundwork"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.importlinter]
root_package = "groundwork"

[[tool.importlinter.contracts]]
name = "core is a leaf: generic engine imports nothing else from groundwork"
type = "forbidden"
source_modules = ["groundwork.core"]
forbidden_modules = ["groundwork.db", "groundwork.api", "groundwork.ingest", "groundwork.domain", "groundwork.schemas", "groundwork.cli", "groundwork.config"]

[[tool.importlinter.contracts]]
name = "the agent proposes, never acts: no path to executors, approvals, the ledger or the database"
type = "forbidden"
source_modules = ["groundwork.agent"]
forbidden_modules = ["groundwork.executors", "groundwork.approvals", "groundwork.ledger", "groundwork.db", "groundwork.service", "groundwork.api"]

[[tool.importlinter.contracts]]
name = "ingestion can never create an approval"
type = "forbidden"
source_modules = ["groundwork.ingest"]
forbidden_modules = ["groundwork.approvals", "groundwork.executors", "groundwork.agent"]

[[tool.importlinter.contracts]]
name = "the gateway is pure: no database, ledger, model client, executors or vertical rules"
type = "forbidden"
source_modules = ["groundwork.policy"]
forbidden_modules = ["groundwork.db", "groundwork.ledger", "groundwork.agent", "groundwork.executors", "groundwork.domain", "groundwork.service", "groundwork.api"]

[[tool.importlinter.contracts]]
name = "the ledger knows nothing about planners, policy or verticals"
type = "forbidden"
source_modules = ["groundwork.ledger"]
forbidden_modules = ["groundwork.agent", "groundwork.policy", "groundwork.domain", "groundwork.executors", "groundwork.service"]

[[tool.importlinter.contracts]]
name = "executors depend only on the shared contract"
type = "forbidden"
source_modules = ["groundwork.executors"]
forbidden_modules = ["groundwork.agent", "groundwork.db", "groundwork.ledger", "groundwork.approvals", "groundwork.service", "groundwork.policy"]
